apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-cost-tracker
  namespace: staging
  labels:
    app: ai-cost-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-cost-tracker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai-cost-tracker
    spec:
      containers:
        - name: app
          image: ghcr.io/USERNAME/ai-cost-tracker/app:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ai-cost-tracker-secrets
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
