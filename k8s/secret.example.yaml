#   --namespace staging \
#   --from-literal=SECRET_KEY="..." \
#   --from-literal=DATABASE_URL="postgres://user:pass@postgres-external:5432/ai_cost_tracker_staging" \
#   --from-literal=REDIS_URL="redis://redis:6379/0" \
