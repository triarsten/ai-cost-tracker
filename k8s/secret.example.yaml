apiVersion: v1
kind: Secret
metadata:
  name: ai-cost-tracker-secrets
  namespace: staging
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_ME"
  DATABASE_URL: "postgres://user:pass@postgres-external:5432/ai_cost_tracker_staging"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  ALLOWED_HOSTS: "ai-cost-tracker.homelab.local,*"
  ENVIRONMENT: "staging"
  OTEL_ENABLED: "false"
  LOG_LEVEL: "INFO"
  ANTHROPIC_ADMIN_API_KEY: "sk-ant-admin-REPLACE_ME"
  FIREWORKS_API_KEY: "fw_REPLACE_ME"
  GEMINI_API_KEY: ""
