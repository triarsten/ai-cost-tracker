apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-cost-tracker
  namespace: staging
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: ai-cost-tracker.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-cost-tracker
                port:
                  number: 8000
