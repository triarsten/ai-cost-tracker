# WICHTIG: Nur 1 Replica — mehrere Beat-Instanzen würden Tasks mehrfach triggern
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-cost-tracker-beat
  namespace: staging
  labels:
    app: ai-cost-tracker-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-cost-tracker-beat
  template:
    metadata:
      labels:
        app: ai-cost-tracker-beat
    spec:
      containers:
        - name: beat
          image: ghcr.io/triarsten/ai-cost-tracker/app:latest
          command:
            - celery
            - -A
            - config
            - beat
            - -l
            - info
            - --scheduler
            - django_celery_beat.schedulers:DatabaseScheduler
          envFrom:
            - secretRef:
                name: ai-cost-tracker-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
