name: Deploy to Staging

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/USERNAME/ai-cost-tracker/app:${{ github.sha }}
            ghcr.io/USERNAME/ai-cost-tracker/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Patch image tag in deployment manifests
        run: |
          IMAGE="ghcr.io/USERNAME/ai-cost-tracker/app:${{ github.sha }}"
          sed -i "s|ghcr.io/USERNAME/ai-cost-tracker/app:.*|${IMAGE}|g" k8s/deployment.yaml
          sed -i "s|ghcr.io/USERNAME/ai-cost-tracker/app:.*|${IMAGE}|g" k8s/worker-deployment.yaml
          sed -i "s|ghcr.io/USERNAME/ai-cost-tracker/app:.*|${IMAGE}|g" k8s/beat-deployment.yaml

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Wait for rollout — web
        id: rollout_web
        run: kubectl rollout status deployment/ai-cost-tracker -n staging --timeout=300s

      - name: Wait for rollout — worker
        id: rollout_worker
        run: kubectl rollout status deployment/ai-cost-tracker-worker -n staging --timeout=300s

      - name: Wait for rollout — beat
        id: rollout_beat
        run: kubectl rollout status deployment/ai-cost-tracker-beat -n staging --timeout=300s

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — rolling back"
          kubectl rollout undo deployment/ai-cost-tracker -n staging || true
          kubectl rollout undo deployment/ai-cost-tracker-worker -n staging || true
          kubectl rollout undo deployment/ai-cost-tracker-beat -n staging || true
